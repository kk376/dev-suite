# ==============================================================================
# ~/.tmux.conf - Multiplexer configuration replicating Ghostty tabs and splits
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Shell & Terminal
# ------------------------------------------------------------------------------
set -g default-shell /usr/bin/fish
set -g default-command /usr/bin/fish
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB:extkeys"
set -as terminal-overrides ",foot*:Cs=\\E]12;%p1%s\\007:Cr=\\E]112\\007"
set -s escape-time 0
set -g focus-events on

# Clipboard & Bell
set -s set-clipboard on
set -g bell-action none
set -g visual-bell off

# 1-based indexing for intuitive tab navigation
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prevent window rename to [tmux] during copy-mode / scrollback
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}#{?pane_dead,[dead],}"

# Automatically destroy session when terminal window closes to avoid orphaned sessions
set-hook -g client-detached 'if-shell -F "#{==:#{session_attached},0}" "kill-session"'

# ------------------------------------------------------------------------------
# 2. Mouse, Selection, Scrolling & Clipboard (Matching Ghostty 1:1)
# ------------------------------------------------------------------------------
set -g mouse on
set -g copy-command "wl-copy -n"

# Selection: Keep text highlighted on drag release (DO NOT auto-copy)
# Text stays selected until you click with Left Mouse Button to copy it
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode MouseDown1Pane if-shell -F "#{selection_present}" "send-keys -X copy-pipe 'wl-copy -n'" "select-pane"
bind -T copy-mode-vi MouseDown1Pane if-shell -F "#{selection_present}" "send-keys -X copy-pipe 'wl-copy -n'" "select-pane"
bind -T copy-mode MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind -T copy-mode-vi MouseDrag1Pane select-pane \; send-keys -X begin-selection

# Double click to select word, triple click to select line (keep highlighted, do not auto-copy)
bind -T root DoubleClick1Pane select-pane -t = \; copy-mode -H \; send-keys -X select-word
bind -T root TripleClick1Pane select-pane -t = \; copy-mode -H \; send-keys -X select-line
bind -T copy-mode DoubleClick1Pane send-keys -X select-word
bind -T copy-mode TripleClick1Pane send-keys -X select-line
bind -T copy-mode-vi DoubleClick1Pane send-keys -X select-word
bind -T copy-mode-vi TripleClick1Pane send-keys -X select-line

# Right-click paste: Use bracketed paste (-p) and strip trailing newlines (-n)
# This guarantees that pasting NEVER automatically presses Enter
bind -T root MouseDown3Pane run-shell -b "wl-paste -n | tmux load-buffer - && tmux paste-buffer -p -d"
bind -T copy-mode MouseDown3Pane run-shell -b "wl-paste -n | tmux load-buffer - && tmux paste-buffer -p -d"
bind -T copy-mode-vi MouseDown3Pane run-shell -b "wl-paste -n | tmux load-buffer - && tmux paste-buffer -p -d"

# Hide the copy mode position indicator [0/68] completely
set -g copy-mode-position-format ""

# Right-side scrollbar matching Ghostty (modal overlay scrollbar)
set -g pane-scrollbars modal
set -g pane-scrollbars-position right
set -g pane-scrollbars-style "bg=default,fg=#7aa2f7,width=1,pad=0"

# Hide cursor while in copy-mode scrollback (Ghostty shows no cursor in scroll history)
# Sets cursor color to terminal background (#070722) on enter, restores to default on exit
set-hook -g pane-mode-changed 'if-shell -F "#{pane_in_mode}" "set -p cursor-colour \"#070722\"" "set -p -u cursor-colour"'

# Smooth scrolling:
# If in alternate screen (less, man, btop, fzf):
#   - If application captures mouse, pass mouse events directly (-M).
#   - Otherwise, send Up/Down arrow keys so pagers scroll smoothly without breaking view.
# If in normal terminal:
#   - WheelUp enters copy-mode with hidden indicator and scrolls up 2 lines.
#   - WheelDown checks if within 2 lines of bottom (or at 0) and INSTANTLY exits copy-mode.
#     If already at bottom in normal mode, WheelDown does nothing (avoids sending bogus escape codes).
bind -T root WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "if-shell -F '#{alternate_on}' 'send-keys -N 2 Up' 'copy-mode -e -H; send-keys -X -N 2 scroll-up'"
bind -T root WheelDownPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "if-shell -F '#{alternate_on}' 'send-keys -N 2 Down' ''"
bind -T copy-mode WheelUpPane send-keys -X -N 2 scroll-up
bind -T copy-mode WheelDownPane if-shell -F "#{<=:#{copy_position},2}" "send-keys -X cancel" "send-keys -X -N 2 scroll-down"
bind -T copy-mode-vi WheelUpPane send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane if-shell -F "#{<=:#{copy_position},2}" "send-keys -X cancel" "send-keys -X -N 2 scroll-down"

# Typing or pressing keys in copy mode exits copy-mode immediately if no active selection
bind -T copy-mode C-c send-keys -X cancel \; send-keys C-c
bind -T copy-mode-vi C-c send-keys -X cancel \; send-keys C-c
bind -T copy-mode Enter if-shell -F "#{selection_present}" "send-keys -X copy-pipe-and-cancel 'wl-copy -n'" "send-keys -X cancel \; send-keys Enter"
bind -T copy-mode-vi Enter if-shell -F "#{selection_present}" "send-keys -X copy-pipe-and-cancel 'wl-copy -n'" "send-keys -X cancel \; send-keys Enter"

# Unbind vi/emacs modal prompts and repeat commands in copy mode
unbind -q -T copy-mode C-r
unbind -q -T copy-mode-vi C-r
unbind -q -T copy-mode C-s
unbind -q -T copy-mode-vi C-s
unbind -q -T copy-mode M-1
unbind -q -T copy-mode-vi M-1
unbind -q -T copy-mode M-2
unbind -q -T copy-mode-vi M-2
unbind -q -T copy-mode M-3
unbind -q -T copy-mode-vi M-3
unbind -q -T copy-mode M-4
unbind -q -T copy-mode-vi M-4
unbind -q -T copy-mode M-5
unbind -q -T copy-mode-vi M-5
unbind -q -T copy-mode M-6
unbind -q -T copy-mode-vi M-6
unbind -q -T copy-mode M-7
unbind -q -T copy-mode-vi M-7
unbind -q -T copy-mode M-8
unbind -q -T copy-mode-vi M-8
unbind -q -T copy-mode M-9
unbind -q -T copy-mode-vi M-9
unbind -q -T copy-mode P
unbind -q -T copy-mode-vi P
unbind -q -T copy-mode R
unbind -q -T copy-mode-vi R
unbind -q -T copy-mode X
unbind -q -T copy-mode-vi X
unbind -q -T copy-mode ,
unbind -q -T copy-mode-vi ,
unbind -q -T copy-mode ;
unbind -q -T copy-mode-vi ;

