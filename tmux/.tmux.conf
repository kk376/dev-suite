# ==============================================================================
# ~/.tmux.conf - Multiplexer configuration replicating Ghostty tabs and splits
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Shell & Terminal
# ------------------------------------------------------------------------------
set -g default-shell /usr/bin/fish
set -g default-command /usr/bin/fish
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB:extkeys"
set -s escape-time 0
set -g focus-events on

# Clipboard & Bell
set -s set-clipboard on
set -g bell-action none
set -g visual-bell off

# 1-based indexing for intuitive tab navigation
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Automatically destroy session when terminal window closes to avoid orphaned sessions
set-hook -g client-detached 'if-shell -F "#{==:#{session_attached},0}" "kill-session"'

# ------------------------------------------------------------------------------
# 2. Mouse & Clipboard (Matching Ghostty 1:1)
# ------------------------------------------------------------------------------
set -g mouse on
set -g copy-command "wl-copy"
bind -T root WheelUpPane   if-shell -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'
bind -T root WheelDownPane if-shell -F '#{pane_in_mode}' 'send-keys -M' ''
bind -T root MouseDown3Pane run-shell "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer -d"

# ------------------------------------------------------------------------------
# 3. Tab Bar Styling (1:1 with Ghostty Bottom Rounded Pills)
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default"
set -g status-left ""
set -g status-right ""
set -g status-left-length 0
set -g status-right-length 0
setw -g window-status-separator " "

# Inactive Tab: #24283b slate background, #787c99 text, rounded pill
set -g window-status-format "#[fg=#24283b,bg=default]#[fg=#787c99,bg=#24283b] #{?#{!=:#{window_name},fish},#{window_name},#{b:pane_current_path}} #[fg=#24283b,bg=default]"

# Active Tab: #7aa2f7 vibrant blue background, #16161e dark text, bold, rounded pill
set -g window-status-current-format "#[fg=#7aa2f7,bg=default]#[fg=#16161e,bg=#7aa2f7,bold] #{?#{!=:#{window_name},fish},#{window_name},#{b:pane_current_path}} #[fg=#7aa2f7,bg=default]"

# Prompt & Menu styling
set -g message-style "bg=#7aa2f7,fg=#16161e,bold"
set -g mode-style    "bg=#fff59b,fg=#070722"

# ------------------------------------------------------------------------------
# 4. Native Dynamic Auto-Hide (Hidden on 1 tab, shown on 2+ tabs)
# ------------------------------------------------------------------------------
set -g status off
set-hook -g after-new-window   'if-shell -F "#{>:#{session_windows},1}" "set status on" "set status off"'
set-hook -g after-kill-pane    'if-shell -F "#{>:#{session_windows},1}" "set status on" "set status off"'
set-hook -g window-unlinked    'if-shell -F "#{>:#{session_windows},1}" "set status on" "set status off"'
set-hook -g client-attached    'if-shell -F "#{>:#{session_windows},1}" "set status on" "set status off"'

# ------------------------------------------------------------------------------
# 5. Keybindings (Prefix-Free Ghostty Mappings)
# ------------------------------------------------------------------------------
# Tabs: New Tab at $HOME (Ctrl+T and Ctrl+Shift+T)
bind -n C-t new-window -c ~
bind -n C-S-t new-window -c ~

# Close Tab (Ctrl+W and Ctrl+Shift+W)
bind -n C-w kill-window
bind -n C-S-w kill-window

# Tab Switching (Ctrl+Tab, Ctrl+Shift+Tab, Ctrl+Shift+Right, Ctrl+Shift+Left)
bind -n C-Tab next-window
bind -n C-S-Tab previous-window
bind -n C-S-Right next-window
bind -n C-S-Left previous-window

# Direct Tab Jump (Alt+1 through Alt+9)
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# New OS Window (Ctrl+Shift+Enter spawns a fresh foot terminal)
bind -n C-S-Enter run-shell "foot &"

# Clear Screen (Ctrl+L)
bind -n C-l send-keys C-l \; clear-history

# Tab Overview (Ctrl+Shift+A)
bind -n C-S-a choose-tree -Zw

# Splits (Ctrl+\ for vertical split, Ctrl+_ for horizontal split)
bind -n C-\\ split-window -h -c "#{pane_current_path}"
bind -n C-_ split-window -v -c "#{pane_current_path}"
bind -n "C-S-{" select-pane -t :.-
bind -n "C-S-}" select-pane -t :.+

# Fallback tmux prefix (Ctrl+B)
set -g prefix C-b
bind C-b send-prefix
