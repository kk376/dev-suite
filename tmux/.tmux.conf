# ------------------------------------------------------------------------------
# 3. Tab Bar Styling (1:1 with Ghostty Bottom Rounded Pills)
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default"
set -g status-left ""
set -g status-right ""
set -g status-left-length 0
set -g status-right-length 0
setw -g window-status-separator " "

# Inactive Tab: #24283b slate background, #787c99 text, rounded pill
set -g window-status-format "#[fg=#24283b,bg=default]#[fg=#787c99,bg=#24283b] #{?#{||:#{==:#{window_name},fish},#{==:#{window_name},[tmux]}},#{b:pane_current_path},#{window_name}} #[fg=#24283b,bg=default]"

# Active Tab: #7aa2f7 vibrant blue background, #16161e dark text, bold, rounded pill
set -g window-status-current-format "#[fg=#7aa2f7,bg=default]#[fg=#16161e,bg=#7aa2f7,bold] #{?#{||:#{==:#{window_name},fish},#{==:#{window_name},[tmux]}},#{b:pane_current_path},#{window_name}} #[fg=#7aa2f7,bg=default]"

# Click tab to select, drag tab with mouse to reorder in real-time, or scroll wheel
# MouseDown1Status: click selects the tab
# MouseDrag1Status: fires continuously during drag, live-swaps tab to current mouse position
# MouseUp1Status/DragEnd: clean up the marked pane state
bind -T root MouseDown1Status select-window -t =
bind -T root MouseDrag1Status swap-window -d -t =
bind -T root MouseDragEnd1Status send-keys ""
bind -T root WheelUpStatus swap-window -d -t -1
bind -T root WheelDownStatus swap-window -d -t +1

# Prompt & Menu styling
set -g message-style "bg=#7aa2f7,fg=#16161e,bold"
set -g mode-style    "bg=#fff59b,fg=#070722"

# ------------------------------------------------------------------------------
# 4. Native Dynamic Auto-Hide (Hidden on 1 tab, shown on 2+ tabs)
# ------------------------------------------------------------------------------
set -g status off
set-hook -g after-new-window   'if-shell -F "#{>:#{session_windows},1}" "set status on" "set status off"'
set-hook -g after-kill-pane    'if-shell -F "#{>:#{session_windows},1}" "set status on" "set status off"'
set-hook -g window-unlinked    'if-shell -F "#{>:#{session_windows},1}" "set status on" "set status off"'
set-hook -g client-attached    'if-shell -F "#{>:#{session_windows},1}" "set status on" "set status off"'

# ------------------------------------------------------------------------------
# 5. Keybindings (Prefix-Free Ghostty Mappings)
# ------------------------------------------------------------------------------
# Tabs: New Tab at $HOME (Ctrl+T and Ctrl+Shift+T)
bind -n C-t new-window -c ~
bind -n C-S-t new-window -c ~

# Close Tab (Ctrl+W and Ctrl+Shift+W)
bind -n C-w kill-window
bind -n C-S-w kill-window

# Tab Switching (Ctrl+Tab, Ctrl+Shift+Tab, Ctrl+Shift+Right, Ctrl+Shift+Left)
bind -n C-Tab next-window
bind -n C-S-Tab previous-window
bind -n C-S-Right next-window
bind -n C-S-Left previous-window

# Tab Reordering (Alt+Shift+Left / Alt+Shift+Right)
bind -n M-S-Left swap-window -d -t -1
bind -n M-S-Right swap-window -d -t +1

# Direct Tab Jump (Alt+1 through Alt+9)
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# New OS Window (Ctrl+Shift+Enter spawns a fresh foot terminal)
bind -n C-S-Enter run-shell "foot &"

# Clear Screen (Ctrl+L)
bind -n C-l send-keys C-l \; clear-history

# Tab Overview (Ctrl+Shift+A)
bind -n C-S-a choose-tree -Zw

# Splits (Ctrl+\ for vertical split, Ctrl+_ for horizontal split)
bind -n C-\\ split-window -h -c "#{pane_current_path}"
bind -n C-_ split-window -v -c "#{pane_current_path}"
bind -n "C-S-{" select-pane -t :.-
bind -n "C-S-}" select-pane -t :.+

# Fallback tmux prefix (Ctrl+B)
set -g prefix C-b
bind C-b send-prefix
