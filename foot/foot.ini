# ==============================================================================
# foot.ini - 1:1 reproduction of Ghostty terminal on Wayland / Hyprland
# Theme: Noctalia (Tokyo Night / Noctalia palette with 0.85 alpha transparency)
# Multiplexer: tmux (auto-spawned, isolated per-window, auto-hiding tab bar)
# ==============================================================================

[main]
# Typography matching Ghostty font-size=12 on fractional scaling (1.25x)
font=Fira Code:size=12, Symbols Nerd Font Mono:size=12
font-bold=Fira Code:weight=bold:size=12, Symbols Nerd Font Mono:size=12
font-italic=Fira Code:slant=italic:size=12, Symbols Nerd Font Mono:size=12
font-bold-italic=Fira Code:weight=bold:slant=italic:size=12, Symbols Nerd Font Mono:size=12
dpi-aware=no

# Launch tmux with an independent, clean session per window
shell=/usr/bin/tmux new-session -c /home/kk376
term=foot

# Window layout matching Ghostty maximize=true and padding 16x8x16x2
initial-window-mode=maximized
title=foot
app-id=foot
pad=16x8x16x2

[colors-dark]
# Noctalia palette matching Ghostty theme
background=070722
foreground=f3edf7

regular0=11112d
regular1=fd4663
regular2=9bfece
regular3=fff59b
regular4=a9aefe
regular5=fd4663
regular6=9bfece
regular7=f3edf7

bright0=21215f
bright1=fd4663
bright2=9bfece
bright3=fff59b
bright4=a9aefe
bright5=fd4663
bright6=9bfece
bright7=ffffff

cursor=070722 fff59b
selection-foreground=070722
selection-background=f3edf7
urls=fff59b

# Transparency matching Ghostty background-opacity=0.85
alpha=0.85
alpha-mode=matching
blur=yes

[cursor]
style=beam
beam-thickness=3px
blink=yes
blink-rate=500
unfocused-style=unchanged

[scrollback]
lines=10000000
multiplier=1.0
indicator-position=none

[security]
osc52=enabled

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[mouse-bindings]
selection-override-modifiers=Shift
select-extend=none
clipboard-paste=none
primary-paste=none

[url]
launch=xdg-open ${url}
style=single
osc8-underline=always

[bell]
system=no
urgent=no
notify=no
visual=no
command-focused=no

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
show-urls-launch=Control+Shift+o
