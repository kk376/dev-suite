# --- Typography & Font Ligatures ---
font_family      Fira Code
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5
disable_ligatures never

# --- Translucency & Styling ---
background_opacity         0.90
background_blur            50
dynamic_background_opacity yes
window_padding_width       14 16
hide_window_decorations    no
wayland_titlebar_color     background
linux_display_server       wayland
confirm_os_window_close    0

# --- Cursor Customization ---
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5

# Right-click pastes from clipboard
mouse_map right press ungrabbed paste_from_clipboard

# --- Tab Bar (Hidden on single tab, seamless dark integration when 2+ tabs) ---
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_min_tabs    2
tab_bar_background  #1a1b26
tab_title_template  " {index}: {title} "

active_tab_font_style   bold
inactive_tab_font_style normal

# --- Tab & Window Keybindings ---
map ctrl+shift+t new_tab
map ctrl+t new_tab
map ctrl+shift+w close_tab
map ctrl+w close_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map ctrl+shift+enter new_window
map ctrl+shift+[ previous_window
map ctrl+shift+] next_window

# --- Audio & Shell ---
enable_audio_bell no
shell zsh

# --- Tokyo Night Color Scheme ---
background #1a1b26
foreground #c0caf5
selection_background #33467c
selection_foreground #c0caf5
url_color #73daca
cursor #c0caf5
cursor_text_color #1a1b26

active_tab_background #7aa2f7
active_tab_foreground #16161e
inactive_tab_background #24283b
inactive_tab_foreground #787c99

color0 #15161e
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6
color8 #414868
color9 #f7768e
