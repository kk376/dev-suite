# ==============================================================================
# Alacritty Configuration - Tokyo Night Theme & Fira Code Profile
# Matching Ghostty Configuration 1:1
# ==============================================================================

[general]
live_config_reload = true

[env]
TERM = "alacritty"

# --- Window Geometry, Padding & Styling (Matching Ghostty 1:1) ---
[window]
opacity = 1.0
blur = false
decorations = "Full"
dynamic_padding = false
startup_mode = "Maximized"

[window.padding]
x = 16
y = 8

[window.dimensions]
columns = 0
lines = 0

# --- Typography & Font Ligatures (Matching Ghostty 11.5pt) ---
[font]
size = 11.5

[font.normal]
family = "Fira Code"
style = "Regular"

[font.bold]
family = "Fira Code"
style = "Bold"

[font.italic]
family = "Fira Code"
style = "Italic"

[font.bold_italic]
family = "Fira Code"
style = "Bold Italic"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

# --- Cursor Customization (Matching Ghostty Bar Style) ---
[cursor]
thickness = 0.25
blink_interval = 500
blink_timeout = 0
unfocused_hollow = false

[cursor.style]
shape = "Beam"
blinking = "On"

# --- Audio Bell & Shell ---
[bell]
animation = "EaseOutExpo"
duration = 0

[terminal.shell]
program = "/usr/bin/fish"

# --- Mouse & Selection (Matching Ghostty Copy-on-Select & Right-Click Paste) ---
[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Right"
action = "Paste"

# --- Tokyo Night Color Scheme ---
[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.cursor]
text = "#1a1b26"
cursor = "#c0caf5"

[colors.selection]
text = "#c0caf5"
background = "#33467c"

[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"

[colors.hints.start]
foreground = "#1a1b26"
background = "#e0af68"

[colors.hints.end]
foreground = "#1a1b26"
background = "#7aa2f7"

# --- Keyboard Shortcuts (Matching Ghostty 1:1) ---
[keyboard]
bindings = [
  # Clipboard
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },

  # Window Creation (Ctrl+Shift+Enter)
  { key = "Return", mods = "Control|Shift", action = "CreateNewWindow" },

  # Terminal Controls & Scrollback Clear
  { key = "K", mods = "Control|Shift", action = "ClearHistory" },

  # Font Zoom
  { key = "Plus", mods = "Control", action = "IncreaseFontSize" },
  { key = "Equals", mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
  { key = "Key0", mods = "Control", action = "ResetFontSize" },
  { key = "F11", mods = "None", action = "ToggleFullscreen" },
]
